name: master_billing
description: "Master Billing - Complete POS & Billing App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  provider: ^6.1.2
  dio: ^5.4.3
  shared_preferences: ^2.2.3
  fl_chart: ^0.69.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  badges: ^3.1.2
  expandable: ^5.0.1
  currency_formatter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

